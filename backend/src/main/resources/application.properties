server.port=8080

# UTF-8 (Türkçe karakterler)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

ollama.base-url=http://localhost:11434
ollama.model=llama3.1:8b

# Speed knobs (Ollama /api/generate options.num_predict)
ollama.sql.num-predict=128
ollama.summary.num-predict=160


llm.turkish-summary.enabled=true

# CORS (comma-separated). Default allows localhost:4200
cors.allowed-origins=http://localhost:4200

# LLM SQL cache (in-memory)
llm.sql-cache.enabled=true
llm.sql-cache.max-size=200
llm.sql-cache.ttl-seconds=3600